<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC远程桌面 - 观看端 v2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .config-section {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .input-group input {
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #2196F3;
        }

        .connection-input {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .connection-input h3 {
            color: #1976d2;
            margin-bottom: 15px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 150px;
        }

        .btn-primary {
            background: #2196F3;
            color: white;
        }

        .btn-primary:hover {
            background: #1976D2;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #d32f2f;
        }

        .btn-secondary {
            background: #4CAF50;
            color: white;
        }

        .btn-secondary:hover {
            background: #45a049;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .video-section {
            padding: 30px;
            text-align: center;
        }

        .remote-video-container {
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            margin: 0 auto;
            max-width: 100%;
        }

        .remote-video-container h3 {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 10;
        }

        #remoteVideo {
            width: 100%;
            height: 600px;
            object-fit: contain;
            display: none;
        }

        .placeholder {
            width: 100%;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 1.2em;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .status-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #2196F3;
        }

        .status-item.error {
            border-left-color: #f44336;
        }

        .status-item.warning {
            border-left-color: #ff9800;
        }

        .status-item.success {
            border-left-color: #4CAF50;
        }

        .logs {
            background: #263238;
            color: #fff;
            padding: 20px;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-top: 20px;
        }

        .log-entry {
            margin: 5px 0;
            padding: 2px 0;
        }

        .log-entry.error {
            color: #ff5252;
        }

        .log-entry.success {
            color: #4caf50;
        }

        .log-entry.warning {
            color: #ff9800;
        }

        .fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 10;
        }

        .fullscreen-btn:hover {
            background: rgba(0,0,0,0.9);
        }

        @media (max-width: 768px) {
            .config-grid {
                grid-template-columns: 1fr;
            }
            
            #remoteVideo {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👁️ WebRTC远程桌面 v2</h1>
            <p>观看端 - 使用WebSocket信令服务器</p>
        </div>

        <div class="config-section">
            <div class="connection-input">
                <h3>🔗 连接到远程桌面</h3>
                <div class="input-group">
                    <label for="connectionId">连接ID</label>
                    <input type="text" id="connectionId" placeholder="输入屏幕共享端提供的连接ID" style="font-size: 1.2em; text-align: center;">
                </div>
            </div>

            <h3>🔧 服务器配置</h3>
            <div class="config-grid">
                <div class="input-group">
                    <label for="signalingServer">信令服务器</label>
                    <input type="text" id="signalingServer" placeholder="ws://localhost:8080" value="ws://localhost:8080">
                </div>
                <div class="input-group">
                    <label for="stunServer">STUN服务器</label>
                    <input type="text" id="stunServer" placeholder="stun:your-server:3478" value="stun:127.0.0.1:3478">
                </div>
                <div class="input-group">
                    <label for="turnServer">TURN服务器</label>
                    <input type="text" id="turnServer" placeholder="turn:your-server:3478" value="turn:127.0.0.1:3478">
                </div>
                <div class="input-group">
                    <label for="turnUsername">TURN用户名</label>
                    <input type="text" id="turnUsername" placeholder="用户名" value="testuser">
                </div>
                <div class="input-group">
                    <label for="turnPassword">TURN密码</label>
                    <input type="password" id="turnPassword" placeholder="密码" value="testpass">
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="connectBtn" onclick="connectToRemote()">🔗 连接远程桌面</button>
                <button class="btn btn-danger" id="disconnectBtn" onclick="disconnect()" disabled>❌ 断开连接</button>
            </div>
        </div>

        <div class="video-section">
            <div class="remote-video-container">
                <h3>🖥️ 远程桌面</h3>
                <button class="fullscreen-btn" onclick="toggleFullscreen()" title="全屏显示">⛶</button>
                <video id="remoteVideo" autoplay></video>
                <div id="placeholder" class="placeholder">
                    <div>
                        <p>📺 等待连接远程桌面...</p>
                        <p style="margin-top: 10px; font-size: 0.9em; color: #999;">请输入连接ID并点击连接</p>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-secondary" onclick="toggleFullscreen()">🔍 全屏显示</button>
                <button class="btn btn-secondary" onclick="takeScreenshot()">📸 截图</button>
                <button class="btn btn-secondary" onclick="toggleAudio()">🔊 音频开关</button>
            </div>
        </div>

        <div class="status-section">
            <h3>📊 连接状态</h3>
            <div id="statusContainer">
                <div class="status-item">
                    <span>🔴</span>
                    <span>等待连接...</span>
                </div>
            </div>
            
            <div class="logs" id="logs"></div>
        </div>
    </div>

    <script>
        let peerConnection = null;
        let signalingSocket = null;
        let isConnected = false;
        let remoteStream = null;
        let roomId = null;

        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        function updateStatus(message, type = 'info') {
            const container = document.getElementById('statusContainer');
            const statusItem = document.createElement('div');
            statusItem.className = `status-item ${type}`;
            
            const icon = type === 'error' ? '🔴' : type === 'success' ? '🟢' : '🟡';
            statusItem.innerHTML = `<span>${icon}</span><span>${message}</span>`;
            
            container.appendChild(statusItem);
        }

        function getIceServers() {
            const stunServer = document.getElementById('stunServer').value;
            const turnServer = document.getElementById('turnServer').value;
            const turnUsername = document.getElementById('turnUsername').value;
            const turnPassword = document.getElementById('turnPassword').value;

            const iceServers = [];
            
            if (stunServer) {
                iceServers.push({ urls: stunServer });
            }
            
            if (turnServer && turnUsername && turnPassword) {
                iceServers.push({
                    urls: turnServer,
                    username: turnUsername,
                    credential: turnPassword
                });
            }

            return iceServers;
        }

        async function connectSignaling() {
            const signalingUrl = document.getElementById('signalingServer').value;
            
            return new Promise((resolve, reject) => {
                signalingSocket = new WebSocket(signalingUrl);
                
                signalingSocket.onopen = () => {
                    log('信令服务器连接成功', 'success');
                    resolve();
                };
                
                signalingSocket.onerror = (error) => {
                    log('信令服务器连接失败', 'error');
                    reject(error);
                };
                
                signalingSocket.onmessage = (event) => {
                    const message = JSON.parse(event.data);
                    handleSignalingMessage(message);
                };
                
                signalingSocket.onclose = () => {
                    log('信令服务器连接已断开', 'warning');
                };
            });
        }

        function handleSignalingMessage(message) {
            log(`收到信令消息: ${message.type}`, 'info');
            
            switch (message.type) {
                case 'connected':
                    log(`客户端ID: ${message.clientId}`, 'success');
                    break;
                    
                case 'room-joined':
                    log(`已加入房间: ${message.roomId}`, 'success');
                    updateStatus('已加入房间，正在建立连接...', 'success');
                    break;
                    
                case 'answer':
                    handleAnswer(message);
                    break;
                    
                case 'ice-candidate':
                    handleIceCandidate(message);
                    break;
                    
                case 'host-disconnected':
                    log('主机已断开连接', 'warning');
                    updateStatus('主机已断开连接', 'warning');
                    disconnect();
                    break;
                    
                case 'error':
                    log(`错误: ${message.message}`, 'error');
                    updateStatus(`错误: ${message.message}`, 'error');
                    break;
            }
        }

        async function handleAnswer(message) {
            try {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(message.answer));
                log('收到连接应答，连接建立中...', 'success');
                updateStatus('连接已建立，等待视频流...', 'success');
            } catch (error) {
                log(`处理应答失败: ${error.message}`, 'error');
            }
        }

        async function handleIceCandidate(message) {
            if (peerConnection) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(message.candidate));
                    log('添加ICE候选者', 'info');
                } catch (error) {
                    log(`添加ICE候选者失败: ${error.message}`, 'error');
                }
            }
        }

        async function connectToRemote() {
            roomId = document.getElementById('connectionId').value.trim();
            
            if (!roomId) {
                log('请输入连接ID', 'error');
                updateStatus('请输入连接ID', 'error');
                return;
            }

            try {
                log(`正在连接到远程桌面: ${roomId}`, 'info');
                updateStatus('正在建立连接...', 'info');

                // 连接信令服务器
                await connectSignaling();

                // 加入房间
                signalingSocket.send(JSON.stringify({
                    type: 'join-room',
                    roomId: roomId
                }));

                // 创建RTCPeerConnection
                const iceServers = getIceServers();
                peerConnection = new RTCPeerConnection({ iceServers });

                // 设置事件处理
                setupPeerConnection();

                // 创建offer并发送
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                // 发送连接请求
                signalingSocket.send(JSON.stringify({
                    type: 'offer',
                    offer: offer
                }));

                log('已发送连接请求', 'info');

                // 更新UI状态
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;

            } catch (error) {
                log(`连接失败: ${error.message}`, 'error');
                updateStatus(`连接失败: ${error.message}`, 'error');
            }
        }

        function setupPeerConnection() {
            // ICE候选者处理
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    signalingSocket.send(JSON.stringify({
                        type: 'ice-candidate',
                        candidate: event.candidate
                    }));
                    log('发送ICE候选者', 'info');
                }
            };

            // 连接状态监控
            peerConnection.onconnectionstatechange = () => {
                log(`连接状态: ${peerConnection.connectionState}`, 'info');
                updateStatus(`连接状态: ${peerConnection.connectionState}`, 
                    peerConnection.connectionState === 'connected' ? 'success' : 'info');
                
                if (peerConnection.connectionState === 'connected') {
                    isConnected = true;
                    // 通知主机观看者已连接
                    signalingSocket.send(JSON.stringify({
                        type: 'viewer-connected'
                    }));
                }
            };

            // 接收远程流
            peerConnection.ontrack = (event) => {
                log('收到远程视频流', 'success');
                remoteStream = event.streams[0];
                
                const remoteVideo = document.getElementById('remoteVideo');
                const placeholder = document.getElementById('placeholder');
                
                remoteVideo.srcObject = remoteStream;
                remoteVideo.style.display = 'block';
                placeholder.style.display = 'none';
                
                updateStatus('远程桌面连接成功！', 'success');
            };
        }

        function disconnect() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (signalingSocket) {
                signalingSocket.close();
                signalingSocket = null;
            }

            if (remoteStream) {
                remoteStream.getTracks().forEach(track => track.stop());
                remoteStream = null;
            }

            const remoteVideo = document.getElementById('remoteVideo');
            const placeholder = document.getElementById('placeholder');
            
            remoteVideo.srcObject = null;
            remoteVideo.style.display = 'none';
            placeholder.style.display = 'flex';

            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
            
            isConnected = false;
            roomId = null;

            log('已断开连接', 'warning');
            updateStatus('连接已断开', 'warning');
        }

        function toggleFullscreen() {
            const video = document.getElementById('remoteVideo');
            
            if (!document.fullscreenElement) {
                video.requestFullscreen().catch(err => {
                    log(`全屏失败: ${err.message}`, 'error');
                });
            } else {
                document.exitFullscreen();
            }
        }

        function takeScreenshot() {
            const video = document.getElementById('remoteVideo');
            
            if (!remoteStream) {
                log('没有可截图的视频流', 'warning');
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            // 下载截图
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `remote-desktop-${new Date().getTime()}.png`;
                a.click();
                URL.revokeObjectURL(url);
                
                log('截图已保存', 'success');
            });
        }

        function toggleAudio() {
            if (!remoteStream) {
                log('没有音频流', 'warning');
                return;
            }

            const audioTracks = remoteStream.getAudioTracks();
            if (audioTracks.length > 0) {
                audioTracks[0].enabled = !audioTracks[0].enabled;
                log(`音频${audioTracks[0].enabled ? '开启' : '关闭'}`, 'info');
                updateStatus(`音频${audioTracks[0].enabled ? '开启' : '关闭'}`, 'info');
            }
        }

        // 页面卸载时清理资源
        window.addEventListener('beforeunload', () => {
            if (isConnected) {
                disconnect();
            }
        });

        // 初始化日志
        log('WebRTC远程桌面观看端 v2 已就绪', 'success');
        log('请输入连接ID并配置服务器信息', 'info');
    </script>
</body>
</html>
