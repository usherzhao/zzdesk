<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC远程桌面 - 观看端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .config-section {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .input-group input {
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #2196F3;
        }

        .connection-input {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .connection-input h3 {
            color: #1976d2;
            margin-bottom: 15px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 150px;
        }

        .btn-primary {
            background: #2196F3;
            color: white;
        }

        .btn-primary:hover {
            background: #1976D2;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #d32f2f;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .video-section {
            padding: 30px;
            text-align: center;
        }

        .remote-video-container {
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            margin: 0 auto;
            max-width: 100%;
        }

        .remote-video-container h3 {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 10;
        }

        #remoteVideo {
            width: 100%;
            height: 600px;
            object-fit: contain;
            display: none;
        }

        .placeholder {
            width: 100%;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 1.2em;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .status-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #2196F3;
        }

        .status-item.error {
            border-left-color: #f44336;
        }

        .status-item.warning {
            border-left-color: #ff9800;
        }

        .status-item.success {
            border-left-color: #4CAF50;
        }

        .logs {
            background: #263238;
            color: #fff;
            padding: 20px;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-top: 20px;
        }

        .log-entry {
            margin: 5px 0;
            padding: 2px 0;
        }

        .log-entry.error {
            color: #ff5252;
        }

        .log-entry.success {
            color: #4caf50;
        }

        .log-entry.warning {
            color: #ff9800;
        }

        .fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 10;
        }

        .fullscreen-btn:hover {
            background: rgba(0,0,0,0.9);
        }

        @media (max-width: 768px) {
            .config-grid {
                grid-template-columns: 1fr;
            }
            
            #remoteVideo {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👁️ WebRTC远程桌面</h1>
            <p>观看端 - 连接到远程桌面</p>
        </div>

        <div class="config-section">
            <div class="connection-input">
                <h3>🔗 连接到远程桌面</h3>
                <div class="input-group">
                    <label for="connectionId">连接ID</label>
                    <input type="text" id="connectionId" placeholder="输入屏幕共享端提供的连接ID" style="font-size: 1.2em; text-align: center;">
                </div>
            </div>

            <h3>🔧 COTURN服务器配置</h3>
            <div class="config-grid">
                <div class="input-group">
                    <label for="stunServer">STUN服务器</label>
                    <input type="text" id="stunServer" placeholder="stun:your-server:3478" value="stun:127.0.0.1:3478">
                </div>
                <div class="input-group">
                    <label for="turnServer">TURN服务器</label>
                    <input type="text" id="turnServer" placeholder="turn:your-server:3478" value="turn:127.0.0.1:3478">
                </div>
                <div class="input-group">
                    <label for="turnUsername">TURN用户名</label>
                    <input type="text" id="turnUsername" placeholder="用户名" value="testuser">
                </div>
                <div class="input-group">
                    <label for="turnPassword">TURN密码</label>
                    <input type="password" id="turnPassword" placeholder="密码" value="testpass">
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="connectBtn" onclick="connectToRemote()">🔗 连接远程桌面</button>
                <button class="btn btn-danger" id="disconnectBtn" onclick="disconnect()" disabled>❌ 断开连接</button>
            </div>
        </div>

        <div class="video-section">
            <div class="remote-video-container">
                <h3>🖥️ 远程桌面</h3>
                <button class="fullscreen-btn" onclick="toggleFullscreen()" title="全屏显示">⛶</button>
                <video id="remoteVideo" autoplay></video>
                <div id="placeholder" class="placeholder">
                    <div>
                        <p>📺 等待连接远程桌面...</p>
                        <p style="margin-top: 10px; font-size: 0.9em; color: #999;">请输入连接ID并点击连接</p>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-secondary" onclick="toggleFullscreen()">🔍 全屏显示</button>
                <button class="btn btn-secondary" onclick="takeScreenshot()">📸 截图</button>
                <button class="btn btn-secondary" onclick="toggleAudio()">🔊 音频开关</button>
            </div>
        </div>

        <div class="status-section">
            <h3>📊 连接状态</h3>
            <div id="statusContainer">
                <div class="status-item">
                    <span>🔴</span>
                    <span>等待连接...</span>
                </div>
            </div>
            
            <div class="logs" id="logs"></div>
        </div>
    </div>

    <script>
        let peerConnection = null;
        let signalingSocket = null;
        let isConnected = false;
        let remoteStream = null;

        // 简单的信令服务器模拟
        class SimpleSignaling {
            constructor() {
                this.connections = new Map();
                this.messageHandlers = new Map();
            }

            connect(id) {
                this.connectionId = id;
                this.connections.set(id, this);
                log(`信令连接已建立，ID: ${id}`, 'success');
                return Promise.resolve();
            }

            send(targetId, message) {
                // 模拟网络延迟
                setTimeout(() => {
                    const target = this.connections.get(targetId);
                    if (target && target.onmessage) {
                        target.onmessage({ data: JSON.stringify(message) });
                    }
                }, 100);
            }

            on(event, handler) {
                this.messageHandlers.set(event, handler);
            }

            onmessage(event) {
                const message = JSON.parse(event.data);
                const handler = this.messageHandlers.get(message.type);
                if (handler) {
                    handler(message);
                }
            }
        }

        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        function updateStatus(message, type = 'info') {
            const container = document.getElementById('statusContainer');
            const statusItem = document.createElement('div');
            statusItem.className = `status-item ${type}`;
            
            const icon = type === 'error' ? '🔴' : type === 'success' ? '🟢' : '🟡';
            statusItem.innerHTML = `<span>${icon}</span><span>${message}</span>`;
            
            container.appendChild(statusItem);
        }

        async function hasPublicIP() {
            try {
                // 检测是否具有公网IP地址
                const pc = new RTCPeerConnection({
                    iceServers: [],
                    iceTransportPolicy: 'relay' // 只使用TURN服务器，不使用STUN
                });
                
                // 创建一个虚假的数据通道以触发ICE候选者收集
                pc.createDataChannel('fake');
                
                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        const candidate = event.candidate.candidate;
                        // 检查候选者是否包含公网IP
                        if (candidate.includes('typ relay')) {
                            // 如果是relay类型，则说明需要通过TURN服务器，可能没有公网IP
                            pc.close();
                            return false;
                        } else if (candidate.includes('typ srflx')) {
                            // 如果是srflx（server reflexive）类型，则说明有公网IP
                            pc.close();
                            return true;
                        }
                    } else {
                        // 没有更多候选者，检查是否获得了主机候选者
                        pc.close();
                        return true; // 默认认为有公网IP
                    }
                };
                
                await pc.setLocalDescription();
                // 等待一段时间以收集ICE候选者
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                return true; // 默认返回true
            } catch (error) {
                console.warn('Error checking public IP:', error);
                return true; // 出错时默认认为有公网IP
            }
        }

        function getIceServers() {
            const stunServer = document.getElementById('stunServer').value;
            const turnServer = document.getElementById('turnServer').value;
            const turnUsername = document.getElementById('turnUsername').value;
            const turnPassword = document.getElementById('turnPassword').value;

            const iceServers = [];
            
            // 检查当前访问是否具有公网IP
            const hasPublicIP = checkIfHasPublicIP();
            
            if (hasPublicIP && stunServer) {
                // 如果有公网IP，仍然添加STUN服务器以帮助穿越NAT
                iceServers.push({ urls: stunServer });
            }
            
            if (turnServer && turnUsername && turnPassword) {
                // 始终添加TURN服务器作为备用
                iceServers.push({
                    urls: turnServer,
                    username: turnUsername,
                    credential: turnPassword
                });
            }

            return iceServers;
        }

        function checkIfHasPublicIP() {
            // 获取本机IP信息的一种方式
            return new Promise((resolve) => {
                const pc = new RTCPeerConnection({
                    iceServers: []
                });
                
                pc.createDataChannel('');
                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        const candidate = event.candidate.candidate;
                        if (candidate) {
                            // 检查是否包含公网IP地址
                            const ipMatch = candidate.match(/(\d+\.\d+\.\d+\.\d+)/);
                            if (ipMatch) {
                                const ip = ipMatch[1];
                                // 检查是否为私有IP地址段
                                const isPrivateIP = /^10\.|^172\.(1[6-9]|2\d|3[01])\.|^192\.168\.|^127\.|^169\.254\./.test(ip);
                                if (!isPrivateIP) {
                                    resolve(true); // 有公网IP
                                    return;
                                }
                            }
                        }
                    } else {
                        // 没有更多候选者时，默认认为有公网IP
                        resolve(true);
                    }
                };

                pc.createOffer()
                    .then(offer => pc.setLocalDescription(offer))
                    .catch(() => resolve(true)); // 出错时默认认为有公网IP
                    
                // 设置超时，避免长时间等待
                setTimeout(() => {
                    resolve(true);
                    if (pc.signalingState !== 'closed') {
                        pc.close();
                    }
                }, 2000);
            });
        }

        async function connectToRemote() {
            const connectionId = document.getElementById('connectionId').value.trim();
            
            if (!connectionId) {
                log('请输入连接ID', 'error');
                updateStatus('请输入连接ID', 'error');
                return;
            }

            try {
                log(`正在连接到远程桌面: ${connectionId}`, 'info');
                updateStatus('正在建立连接...', 'info');

                // 初始化信令
                signalingSocket = new SimpleSignaling();
                await signalingSocket.connect(`viewer_${Date.now()}`);

                // 设置信令处理
                setupSignaling();

                // 创建RTCPeerConnection
                const iceServers = getIceServers();
                peerConnection = new RTCPeerConnection({ iceServers });

                // 设置事件处理
                setupPeerConnection();

                // 创建offer并发送
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                // 发送连接请求
                signalingSocket.send(connectionId, {
                    type: 'offer',
                    offer: offer,
                    from: signalingSocket.connectionId
                });

                log('已发送连接请求', 'info');

                // 更新UI状态
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;

            } catch (error) {
                log(`连接失败: ${error.message}`, 'error');
                updateStatus(`连接失败: ${error.message}`, 'error');
            }
        }

        function setupSignaling() {
            signalingSocket.on('answer', async (message) => {
                log('收到连接应答', 'success');
                await peerConnection.setRemoteDescription(new RTCSessionDescription(message.answer));
                updateStatus('连接已建立，等待视频流...', 'success');
            });

            signalingSocket.on('ice-candidate', async (message) => {
                if (peerConnection) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(message.candidate));
                    log('添加ICE候选者', 'info');
                }
            });
        }

        function setupPeerConnection() {
            // ICE候选者处理
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    const connectionId = document.getElementById('connectionId').value.trim();
                    signalingSocket.send(connectionId, {
                        type: 'ice-candidate',
                        candidate: event.candidate,
                        from: signalingSocket.connectionId
                    });
                    log('发送ICE候选者', 'info');
                }
            };

            // 连接状态监控
            peerConnection.onconnectionstatechange = () => {
                log(`连接状态: ${peerConnection.connectionState}`, 'info');
                updateStatus(`连接状态: ${peerConnection.connectionState}`, 
                    peerConnection.connectionState === 'connected' ? 'success' : 'info');
                
                if (peerConnection.connectionState === 'connected') {
                    isConnected = true;
                    // 通知远程端观看者已连接
                    const connectionId = document.getElementById('connectionId').value.trim();
                    signalingSocket.send(connectionId, {
                        type: 'viewer-connected',
                        from: signalingSocket.connectionId
                    });
                }
            };

            // 接收远程流
            peerConnection.ontrack = (event) => {
                log('收到远程视频流', 'success');
                remoteStream = event.streams[0];
                
                const remoteVideo = document.getElementById('remoteVideo');
                const placeholder = document.getElementById('placeholder');
                
                remoteVideo.srcObject = remoteStream;
                remoteVideo.style.display = 'block';
                placeholder.style.display = 'none';
                
                updateStatus('远程桌面连接成功！', 'success');
            };
        }

        function disconnect() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (remoteStream) {
                remoteStream.getTracks().forEach(track => track.stop());
                remoteStream = null;
            }

            const remoteVideo = document.getElementById('remoteVideo');
            const placeholder = document.getElementById('placeholder');
            
            remoteVideo.srcObject = null;
            remoteVideo.style.display = 'none';
            placeholder.style.display = 'flex';

            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
            
            isConnected = false;

            log('已断开连接', 'warning');
            updateStatus('连接已断开', 'warning');
        }

        function toggleFullscreen() {
            const video = document.getElementById('remoteVideo');
            
            if (!document.fullscreenElement) {
                video.requestFullscreen().catch(err => {
                    log(`全屏失败: ${err.message}`, 'error');
                });
            } else {
                document.exitFullscreen();
            }
        }

        function takeScreenshot() {
            const video = document.getElementById('remoteVideo');
            
            if (!remoteStream) {
                log('没有可截图的视频流', 'warning');
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            // 下载截图
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `remote-desktop-${new Date().getTime()}.png`;
                a.click();
                URL.revokeObjectURL(url);
                
                log('截图已保存', 'success');
            });
        }

        function toggleAudio() {
            if (!remoteStream) {
                log('没有音频流', 'warning');
                return;
            }

            const audioTracks = remoteStream.getAudioTracks();
            if (audioTracks.length > 0) {
                audioTracks[0].enabled = !audioTracks[0].enabled;
                log(`音频${audioTracks[0].enabled ? '开启' : '关闭'}`, 'info');
                updateStatus(`音频${audioTracks[0].enabled ? '开启' : '关闭'}`, 'info');
            }
        }

        // 页面卸载时清理资源
        window.addEventListener('beforeunload', () => {
            if (isConnected) {
                disconnect();
            }
        });

        // 初始化日志
        log('WebRTC远程桌面观看端已就绪', 'success');
        log('请输入连接ID并配置COTURN服务器信息', 'info');
    </script>
</body>
</html>
